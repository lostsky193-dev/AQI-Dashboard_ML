<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live AQI Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        .header { margin-bottom: 30px; text-align: center; }
        .header h1 { margin: 0; font-size: 2.3rem; letter-spacing: 2px; }
        .live-indicator { color: #10b981; font-weight: bold; animation: pulse 2s infinite; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; }
        .card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 20px; text-align: center; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: rgba(56, 189, 248, 0.4); }
        .card h3 { margin: 0 0 10px 0; color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; }
        .value { font-size: 2.2rem; font-weight: bold; color: #38bdf8; transition: color 0.3s, text-shadow 0.3s; }
        .value-text { font-size: 1.5rem; font-weight: bold; color: #f59e0b; }
        
        .value.updated { color: #10b981; text-shadow: 0 0 15px #10b981; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Advanced AQI Dashboard</h1>
        <p class="live-indicator">● LIVE SENSOR TELEMETRY</p>
    </div>

    <div class="grid">
        <div class="card"><h3>Final AQI</h3><div id="aqi" class="value">--</div></div>
        <div class="card"><h3>Category</h3><div id="category" class="value value-text">--</div></div>
        <div class="card"><h3>Dominant</h3><div id="dominant" class="value value-text">--</div></div>
        <div class="card"><h3>Temperature</h3><div id="temp" class="value">-- °C</div></div>
        <div class="card"><h3>Humidity</h3><div id="hum" class="value">-- %</div></div>
        <div class="card"><h3>CO (MQ7)</h3><div id="co" class="value">-- mg/m³</div></div>
        <div class="card"><h3>CH4 (MQ9)</h3><div id="ch4" class="value">-- ppm</div></div>
        <div class="card"><h3>SO2 (MQ135)</h3><div id="so2" class="value">-- µg/m³</div></div>
        <div class="card"><h3>NO2 (MQ131)</h3><div id="no2" class="value">-- µg/m³</div></div>
        <div class="card"><h3>O3 (MQ131)</h3><div id="o3" class="value">-- µg/m³</div></div>
        <div class="card"><h3>PM 10</h3><div id="pm10" class="value">-- µg/m³</div></div>
        <div class="card"><h3>PM 2.5 (GP2Y)</h3><div id="pm25" class="value">-- µg/m³</div></div>
    </div>

    <script>
        const socket = io();
        function updateValue(id, val, unit) {
            const el = document.getElementById(id);
            if (!el) return;
            // Round numbers to 2 decimals if they are numbers
            if (typeof val === 'number') val = val.toFixed(2);
            el.innerText = val + (unit ? ' ' + unit : '');
            el.classList.add('updated');
            setTimeout(() => el.classList.remove('updated'), 400);
        }

        socket.on('live_data', function(data) {
            if (data.final_aqi !== undefined) updateValue('aqi', data.final_aqi, '');
            if (data.category !== undefined) updateValue('category', data.category, '');
            if (data.dominant !== undefined) updateValue('dominant', data.dominant, '');
            if (data.temp !== undefined) updateValue('temp', data.temp, '°C');
            if (data.hum !== undefined) updateValue('hum', data.hum, '%');
            if (data.co !== undefined) updateValue('co', data.co, 'mg/m³');
            if (data.ch4 !== undefined) updateValue('ch4', data.ch4, 'ppm');
            if (data.so2 !== undefined) updateValue('so2', data.so2, 'µg/m³');
            if (data.no2 !== undefined) updateValue('no2', data.no2, 'µg/m³');
            if (data.o3 !== undefined) updateValue('o3', data.o3, 'µg/m³');
            if (data.pm10 !== undefined) updateValue('pm10', data.pm10, 'µg/m³');
            if (data.pm25 !== undefined) updateValue('pm25', data.pm25, 'µg/m³');
        });
    </script>
</body>
</html>
